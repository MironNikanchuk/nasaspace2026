name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m pytest -q
      - name: Build and start the Cloud Run container
        run: |
          docker build --tag lunawindow-api:ci .
          docker run --detach --name lunawindow-ci \
            --env PORT=8081 --publish 127.0.0.1:8081:8081 lunawindow-api:ci
          trap 'docker logs lunawindow-ci && docker rm -f lunawindow-ci' EXIT
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8081/api/v1/health
          curl --fail --silent --show-error --output /dev/null \
            --header 'Content-Type: application/json' \
            --data '{"scenarios":[{"site_id":"connecting-ridge","start_utc":"2027-01-07T00:00:00Z","end_utc":"2027-01-08T00:00:00Z","horizon":"terrain"},{"site_id":"malapert-massif","start_utc":"2027-01-07T00:00:00Z","end_utc":"2027-01-08T00:00:00Z"}]}' \
            http://127.0.0.1:8081/api/v1/compare
