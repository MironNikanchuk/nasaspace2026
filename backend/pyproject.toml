[project]
name = "lunawindow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]
spice = ["spiceypy>=8,<9"]
terrain = ["numpy>=2,<3", "rasterio>=1.4,<2"]

[tool.ruff]
line-length = 100
target-version = "py312"
